
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Zull Lyniee</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="glow glow-purple"></div>
    <div class="glow glow-cyan"></div>

    <main class="login-container">
        <section class="anime-panel">
            <img class="anime-image" src="mio-hamiya.jpg" alt="Anime character">
            <div class="image-overlay"></div>
            <a class="brand" href="login.html">
                <span class="brand-icon">🎮</span>
                <span><strong>ZULL <span>LYNIEE</span></strong><small>PIXEL VAULT</small></span>
            </a>
            <div class="anime-caption">
                <span class="mini-tag">✦ NEW PASSWORD</span>
                <h1>START<br><span>AGAIN.</span></h1>
                <p>Buat password baru untuk mengamankan akun Pixel Vault kamu.</p>
            </div>
        </section>

        <section class="form-panel">
            <div class="form-content">
                <div class="mobile-logo">🎮 <span>ZULL <b>LYNIEE</b></span></div>
                <div class="welcome-icon">◈</div>
                <p class="eyebrow">ACCOUNT SECURITY</p>
                <h2>Reset <span>Password</span></h2>
                <p class="description">Masukkan password baru untuk akunmu.</p>

                <form id="resetPasswordForm">
                    <label for="newPassword">PASSWORD BARU</label>
                    <div class="input-wrap">
                        <span>◆</span>
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Minimal 6 karakter"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <label for="confirmPassword">KONFIRMASI PASSWORD</label>
                    <div class="input-wrap">
                        <span>◆</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Ulangi password baru"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <p id="resetMessage" role="status" aria-live="polite"></p>

                    <button class="login-button" type="submit" id="resetButton">
                        <span>SIMPAN PASSWORD BARU</span>
                        <span class="arrow">↗</span>
                    </button>
                </form>

                <p class="register-link">
                    <a href="login.html">Kembali ke Login ↗</a>
                </p>
            </div>
        </section>
    </main>

    <script type="module" src="reset-password.js"></script>
</body>
</html>
